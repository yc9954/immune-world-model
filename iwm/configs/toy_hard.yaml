experiment: toy_hard
# Harder dynamics to stress-test temporal and multicell pillars:
#   - spectral_radius 0.9 → 0.97: z grows larger, enters tanh nonlinear regime
#   - coupling_strength 0.6 → 1.2: neighbor signal 2× stronger
#   - nonlinearity_scale 1.0: kept aggressive
# This makes Ridge's linear approximation break while IWM's
# learned nonlinear dynamics should hold up.

seed: 0

data:
  n_cells: 2048
  n_cell_types: 5
  n_genes_pert: 20
  gene_feature_dim: 8
  n_drugs: 10
  n_cytokines: 8
  latent_dim: 32
  trajectory_len: 10
  dt: 1.0
  neighbor_k: 8
  noise_std: 0.05
  coupling_strength: 1.2      # was 0.6
  spectral_radius: 0.97       # was 0.9
  init_scale: 4.0             # was 1.5 — z0 starts large, deep in tanh nonlinear regime
  action_scale: 2.0           # was 1.0 — gene/drug/cyto effects 2× stronger
  nonlinearity: tanh
  nonlinearity_scale: 1.0

splits:
  iid_val_frac: 0.1
  iid_test_frac: 0.1
  ood_gene_frac: 0.25
  ood_temporal_split_at: 6
  ood_multicell_frac: 0.25

model:
  latent_dim: 32
  gene_embed_dim: 16
  drug_embed_dim: 16
  cyto_embed_dim: 16
  env_embed_dim: 32
  n_layers: 6
  n_heads: 4
  ffn_dim: 128
  dropout: 0.1

training:
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 60
  rollout_steps: 5
  grad_clip: 1.0
  accelerator: auto
  precision: 32
  num_workers: 4
  persistent_workers: true
  threads: null
  loss_weights:
    latent_mse: 1.0
    latent_nll: 0.3
    vicreg:    0.1
    cyto_mse:  0.3
    fate_ce:   0.0
    jepa:      0.2
    rollout:   0.5
    flow:      0.0

logging:
  out_dir: results/toy_hard
  checkpoint_every: 10
