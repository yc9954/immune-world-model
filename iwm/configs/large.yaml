experiment: toy_large

seed: 0

data:
  n_cells: 8192
  n_cell_types: 8
  n_genes_pert: 50
  gene_feature_dim: 16
  n_drugs: 20
  n_cytokines: 16
  latent_dim: 64
  trajectory_len: 15
  dt: 1.0
  neighbor_k: 12
  noise_std: 0.05
  coupling_strength: 0.7
  nonlinearity: tanh
  nonlinearity_scale: 3.0

splits:
  iid_val_frac: 0.1
  iid_test_frac: 0.1
  ood_gene_frac: 0.2
  ood_temporal_split_at: 10
  ood_multicell_frac: 0.25

model:
  latent_dim: 64
  gene_embed_dim: 32
  drug_embed_dim: 32
  cyto_embed_dim: 32
  env_embed_dim: 64
  d_tok: 128
  n_layers: 6
  n_heads: 8
  ffn_dim: 256
  dropout: 0.1

training:
  batch_size: 512
  lr: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 30
  rollout_steps: 4
  grad_clip: 1.0
  accelerator: auto
  precision: 32
  num_workers: 4
  persistent_workers: true
  threads: null
  loss_weights:
    latent_mse: 1.0
    latent_nll: 0.3
    vicreg:    0.1
    cyto_mse:  0.3
    fate_ce:   0.0
    jepa:      0.2
    rollout:   0.5
    flow:      0.0

logging:
  out_dir: results/large_run
  checkpoint_every: 10
